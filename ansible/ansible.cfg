[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
forks = 10
timeout = 30

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# reset_connection (used to prove a fresh SSH login works after SSH/firewall
# changes) closes this control master.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15
