---
# Control group: sysctl (SPEC "sysctl").
- name: Sysctl | start group
  ansible.builtin.include_tasks: _group_start.yml
  vars:
    harden_grp_name: sysctl

- name: Sysctl | parse baseline from data/sysctl.conf
  ansible.builtin.set_fact:
    harden_sysctl_base: >-
      {% set ns = namespace(out=[]) -%}
      {% for l in lookup('ansible.builtin.file', harden_data_dir ~ '/sysctl.conf').splitlines() | map('trim')
           if l | length > 0 and not l is match('^[#;]') and '=' in l -%}
      {% set ns.out = ns.out + [{'key': l.split('=', 1)[0] | trim, 'value': l.split('=', 1)[1] | trim}] -%}
      {% endfor -%}
      {% if harden_kexec_disable | bool -%}
      {% set ns.out = ns.out + [{'key': 'kernel.kexec_load_disabled', 'value': '1'}] -%}
      {% endif -%}
      {% if harden_ipv6_accept_ra_off | bool -%}
      {% set ns.out = ns.out + [{'key': 'net.ipv6.conf.all.accept_ra', 'value': '0'},
                                {'key': 'net.ipv6.conf.default.accept_ra', 'value': '0'}] -%}
      {% endif -%}
      {% if harden_disable_ipv6 | bool -%}
      {% set ns.out = ns.out + [{'key': 'net.ipv6.conf.all.disable_ipv6', 'value': '1'},
                                {'key': 'net.ipv6.conf.default.disable_ipv6', 'value': '1'}] -%}
      {% endif -%}
      {{ ns.out }}

- name: Sysctl | list network interfaces
  ansible.builtin.find:
    paths: /sys/class/net
    file_type: any
  register: harden_sysctl_ifs

- name: Sysctl | add per-interface redirect/source-route keys
  ansible.builtin.set_fact:
    harden_sysctl_wanted: >-
      {% set ns = namespace(out=harden_sysctl_base) -%}
      {% for e in harden_sysctl_base
           if e.key is match('^net\\.ipv[46]\\.conf\\.all\\.(accept_redirects|secure_redirects|send_redirects|accept_source_route)$') -%}
      {% for i in harden_sysctl_ifs.files | map(attribute='path') | map('basename') | reject('equalto', 'lo') | sort -%}
      {% set ns.out = ns.out + [{'key': e.key | replace('.all.', '.' ~ (i | replace('.', '/')) ~ '.'), 'value': e.value}] -%}
      {% endfor -%}
      {% endfor -%}
      {{ ns.out }}

- name: Sysctl | find keys present in /proc/sys
  ansible.builtin.command:
    argv: >-
      {{ ['sh', '-c', 'for k do p=/proc/sys/$(printf %s "$k" | tr ./ /.); [ -e "$p" ] && echo "$k"; done; exit 0', 'sh']
         + (harden_sysctl_wanted | map(attribute='key') | list) }}
  register: harden_sysctl_present
  changed_when: false
  check_mode: false

- name: Sysctl | write /etc/sysctl.d/99-hardening.conf
  ansible.builtin.include_tasks: _file.yml
  vars:
    harden_f:
      path: /etc/sysctl.d/99-hardening.conf
      content: |
        # Managed by linux-hardening (ansible role "hardening"). Local edits are overwritten.
        # Source: data/sysctl.conf (keys missing from /proc/sys skipped) + conditional/per-interface keys.
        {% for e in harden_sysctl_wanted if e.key in harden_sysctl_present.stdout_lines %}
        {{ e.key }} = {{ e.value }}
        {% endfor %}

- name: Sysctl | apply settings
  ansible.builtin.command:
    argv: [sysctl, --system]
  register: harden_sysctl_apply
  changed_when: true
  failed_when: false
  when: "'/etc/sysctl.d/99-hardening.conf' in harden_changed_files"

- name: Sysctl | warn when sysctl --system reported errors
  ansible.builtin.include_tasks: _warn.yml
  vars:
    harden_warn_msg: "sysctl --system returned {{ harden_sysctl_apply.rc }}: {{ harden_sysctl_apply.stderr | default('') | trim }}"
  when:
    - harden_sysctl_apply is not skipped
    - harden_sysctl_apply.rc | default(0) != 0

- name: Sysctl | record group result
  ansible.builtin.include_tasks: _record.yml
