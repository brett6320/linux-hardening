# Copy to inventory.ini and adjust. Connect as a key-capable sudo user, not
# root, so PermitRootLogin can be set to "no" (safety rule 1).
#
# If you change harden_ssh_port, the play reconnects on the new port by
# itself; update ansible_port here afterwards.

[hardened]
web1.example.com ansible_user=admin
db1.example.com  ansible_user=admin ansible_port=2222

